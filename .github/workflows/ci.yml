name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # full history: the industrial source-closure check re-hashes
          # files at the recorded measurement commit (git show)
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install linting tools
        run: pip install "ruff==0.16.8"
      - name: Ruff check
        run: ruff check src/ tests/ spaces/ scripts/ klayout/ notebooks/
      - name: Ruff format check
        run: ruff format --check src/ tests/ spaces/ scripts/ klayout/ notebooks/
      - name: README bilingual parity (English ⇄ Chinese)
        run: python scripts/check_readme_parity.py
      - name: Industrial artifact authority (strict JSON, schema, SHA256SUMS,
          source closure, claims linkage)
        run: |
          PYTHONPATH=src python scripts/verify_industrial_artifacts.py
      - name: Industrial claims drift gate
        run: |
          PYTHONPATH=src python scripts/generate_industrial_claims.py --check
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Pre-commit (all files)
        # Local hooks (ruff/ruff-format) duplicate the steps above with the
        # pinned ruff rev; the real additions are the repo hygiene hooks —
        # trailing whitespace, EOF newline, YAML/TOML validity, large files.
        # Running them in CI closes the `git commit --no-verify` bypass.
        run: pre-commit run --all-files

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with dev deps (+ developer-only VCS integration)
        run: pip install -e ".[dev]" -r requirements-dev-vcs.txt
      - name: Mypy (strict, per pyproject)
        run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        shard:
          - name: models
            paths: tests/test_models
            xdist: "-n auto"
          - name: workflow
            # Serial (no xdist): parallel_tile_inference and test_multiproc
            # spawn subprocesses; xdist nesting deadlocks on Linux runners.
            paths: >-
              tests/test_workflow
              tests/test_semi_p39.py
              tests/test_bayesian_stochastic.py
              tests/test_coverage_gate.py
              tests/test_plugin_gateway.py
              tests/test_multiproc.py
              tests/test_eda_bridge_demo.py
              tests/test_commercial_sim_demo.py
              tests/test_topology_simplification.py
              tests/test_generative_sraf.py
            xdist: ""
          - name: benchmark
            paths: tests/test_benchmark tests/benchmarks tests/test_simulators
            xdist: "-n auto"
          - name: data-utils
            paths: tests/test_data tests/test_utils tests/test_hackathon_manifest.py tests/test_tokens.py
            xdist: "-n auto"
          - name: other
            paths: >-
              tests/test_cli
              tests/test_server
              tests/test_leaderboard
              tests/test_vis
              tests/test_synth
              tests/test_jupyter
              tests/test_api
              tests/test_metrics
              tests/test_baselines
              tests/test_compliance
              tests/test_verify
              tests/test_streaming
              tests/test_plugins
              tests/scripts
            xdist: "-n auto"
    name: "test (${{ matrix.python-version }} / ${{ matrix.shard.name }})"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev deps (+ developer-only VCS integration)
        run: pip install -e ".[dev]" -r requirements-dev-vcs.txt
      - name: Install export extras for CLI shard
        # The test_cli shard exercises ONNX export + onnxruntime round-trip,
        # so install onnx / onnxscript / onnxruntime here. Without this,
        # those tests silently skip via importorskip and a regression in
        # the dynamo exporter would ship green.
        if: matrix.shard.name == 'other'
        run: pip install -e ".[export]"
      - name: Install workflow extras for benchmark shard
        # benchmark/metrics/hotspot.py lazy-imports scipy.optimize at call
        # time (kept out of the main module so other shards don't pay the
        # scipy dep). The hotspot-detection tests in test_benchmark exercise
        # that path, so scipy must be present on this shard.
        if: matrix.shard.name == 'benchmark'
        run: pip install -e ".[workflow]"
      - name: Run tests
        run: pytest ${{ matrix.shard.xdist }} --cov=openlithohub --cov-report=xml --cov-report= -v ${{ matrix.shard.paths }}
      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6.0.2
        with:
          files: ./coverage.xml
          flags: ${{ matrix.shard.name }}
        continue-on-error: true

  coverage-gate:
    # Per-shard coverage is partial by design (each shard runs a subset of
    # tests); this job runs the FULL suite once and hard-fails when total
    # coverage drops below the floor. Optional physics plugins are omitted
    # from the denominator (see [tool.coverage.run] omit in pyproject).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with dev + workflow + export extras
        run: pip install -e ".[dev,workflow,export,server]" -r requirements-dev-vcs.txt
      - name: Full-suite coverage gate (>= 78%)
        run: pytest -q --cov=openlithohub --cov-report=xml --cov-report=term --cov-fail-under=78

  package-smoke:
    # P1.4: test the actual WHEEL — the release bytes must be the tested
    # bytes. Builds an sdist+wheel, twine-checks them, installs the wheel
    # into a clean venv and runs a hermetic import + CLI smoke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build twine
      - name: Bake build identity (P0.11)
        run: |
          pip install pyyaml
          python scripts/write_build_info.py \
            --commit "$GITHUB_SHA" \
            --version "0.0.0.dev0"
      - name: Build sdist + wheel
        run: |
          SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0.dev0 python -m build
      - name: Twine check
        run: twine check dist/*
      - name: Clean-venv wheel install + import/CLI smoke
        run: |
          python -m venv /tmp/smokevenv
          /tmp/smokevenv/bin/pip install --no-cache-dir dist/*.whl
          /tmp/smokevenv/bin/python -c "import openlithohub; from openlithohub import Mask; print('import ok')"
          /tmp/smokevenv/bin/openlithohub --help > /dev/null
          /tmp/smokevenv/bin/python -c "from openlithohub.data import generate_dummy_layout; m = generate_dummy_layout(size=64, seed=0); assert m.shape == (64, 64)"
      - name: Assert baked build identity (P0.11)
        run: |
          /tmp/smokevenv/bin/python -c "import openlithohub._build as b; assert b.BUILD_COMMIT != '', b.BUILD_COMMIT; print('build identity present')"
      - name: Wheel METADATA direct-reference check (PR-B P0.6 — hard gate)
        run: |
          # PR-B: core metadata carries no VCS dependency anymore, so a
          # direct reference in the wheel METADATA is now a hard failure.
          python3 -c "
          import glob, sys, zipfile
          whls = glob.glob('dist/*.whl')
          if not whls:
              sys.exit('no wheel found')
          with zipfile.ZipFile(whls[0]) as z:
              metaname = [n for n in z.namelist() if n.endswith('METADATA')][0]
              meta = z.read(metaname).decode()
          bad = [l for l in meta.splitlines()
                 if l.startswith('Requires-Dist:')
                 and ('@ git+' in l or '@ https://' in l or '@ file:' in l)]
          if bad:
              print('FATAL: direct references in wheel METADATA:')
              for b in bad: print(' ', b)
              sys.exit(1)
          print('no direct references in wheel METADATA ✓')
          "

  package-hermetic:
    # PR-B (repair-plan §16 / P0.6): the release wheel must install and run
    # with NO git executable and NO diff-surrogate present — production
    # installs are hermetic (PyPI-only, no VCS fetch, no source checkout).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Bake build identity
        run: |
          python scripts/write_build_info.py \
            --commit "$GITHUB_SHA" \
            --version "0.0.0.dev0"
      - name: Build wheel
        run: |
          SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0.dev0 python -m build --wheel
      - name: Build a PATH without any git executable
        run: |
          mkdir -p /tmp/nogit
          for d in /usr/local/bin /usr/bin /bin; do
            for f in "$d"/*; do
              base="$(basename "$f")"
              case "$base" in git|git-*) continue ;; esac
              [ -e "/tmp/nogit/$base" ] || ln -s "$f" "/tmp/nogit/$base"
            done
          done
      - name: Install wheel + server extra with no git on PATH
        run: |
          python -m venv /tmp/hermetic
          export PATH="/tmp/hermetic/bin:/tmp/nogit"
          command -v git && { echo "git leaked onto PATH"; exit 1; }
          whl="$(ls dist/openlithohub-*.whl)"
          /tmp/hermetic/bin/pip install --no-cache-dir "${whl}[server]"
      - name: Core + server import smoke without diff-surrogate
        run: |
          export PATH="/tmp/hermetic/bin:/tmp/nogit"
          /tmp/hermetic/bin/python -c "
          import importlib.util as util
          assert util.find_spec('diff_surrogate') is None, 'diff-surrogate leaked into hermetic venv'
          import openlithohub
          import openlithohub._utils
          import openlithohub.server.app
          print('core + server import hermetic ✓')
          "
          /tmp/hermetic/bin/openlithohub --version
          /tmp/hermetic/bin/openlithohub --help > /dev/null

  docs-command-smoke:
    # PR-B (repair-plan §16): documented commands/extras cannot silently
    # drift — README/docs references are validated against pyproject and
    # the real CLI help output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install package (console script + help probes)
        run: |
          SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0.dev0 pip install -e .
      - name: Docs command smoke
        run: python scripts/docs_command_smoke.py

  industrial-v2-protocol:
    # PR-G Phase 2A (§30): fast protocol gate — schema/identity/verifier/
    # claim-generator hostile tests plus the CPU-host preflight refusal.
    # NO expensive measurements run in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + pytest (protocol tests only — no dev stack)
        run: |
          SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0.dev0 pip install -e ".[server,workflow]" pytest
      - name: V2 protocol tests (identity/manifest/timing/correctness gates)
        run: python -m pytest -q tests/test_benchmark/test_industrial_v2.py
      - name: CPU-host preflight must refuse formal publication
        run: |
          python scripts/preflight_industrial_v2.py --gds fixtures/none.gds --device cuda:0 &&           (echo "preflight must fail without CUDA/fixture" && exit 1) ||           test "$?" -eq 1
      - name: Claim generator drift gate (no v2 claims may exist pre-publication)
        run: python scripts/generate_industrial_v2_claims.py --check

  api-contract:
    # PR-D §10: the checked-in OpenAPI snapshot is the API review gate.
    # Kept OUT of the generic test shards: schema drift must fail fast and
    # visibly, with its own required job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package (contract needs the app + pydantic only)
        run: |
          SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0.dev0 pip install -e ".[server]"
      - name: OpenAPI drift gate
        run: python scripts/check_openapi_snapshot.py
      - name: Error-code registry + JobStatus vocabulary + sync headers authority
        run: |
          python - <<'PY'
          from openlithohub.server.schemas import (
              API_SCHEMA_VERSION, ErrorCode, JobStatus, JOB_TRANSITIONS,
          )

          expected_codes = {
              "INVALID_REQUEST", "UNKNOWN_MODEL", "UNKNOWN_JOB", "UPLOAD_TOO_LARGE",
              "QUEUE_FULL", "ADMISSION_FULL", "SERVER_NOT_ACCEPTING",
              "JOB_ARTIFACT_UNAVAILABLE", "JOB_RUNNING", "STREAMING_UNSUPPORTED",
              "MISSING_OPTIONAL_DEPENDENCY", "OPTIMIZATION_FAILED", "INTERNAL_ERROR",
          }
          assert {c.value for c in ErrorCode} == expected_codes, "error-code registry drifted"
          assert {s.value for s in JobStatus} == {
              "queued", "running", "succeeded", "failed", "cancelled",
          }, "JobStatus vocabulary drifted"
          legal = {(JobStatus.QUEUED, JobStatus.RUNNING), (JobStatus.QUEUED, JobStatus.CANCELLED),
                   (JobStatus.RUNNING, JobStatus.SUCCEEDED), (JobStatus.RUNNING, JobStatus.FAILED)}
          have = {(a, b) for a, outs in JOB_TRANSITIONS.items() for b in outs}
          assert have == legal, f"transition table drifted: {have ^ legal}"
          assert API_SCHEMA_VERSION == "1"
          print("api-contract vocabulary OK")
          PY

  perf-sentinel:
    # P2.8: a 1-2 minute sentinel that only catches CATASTROPHIC
    # performance regressions. Thresholds have >50x headroom over the
    # measured baselines; this produces NO benchmark claims.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install '.[data,models]'
      - name: Performance sentinel (generous thresholds)
        run: |
          PYTHONPATH=src python - <<'PY'
          import time, torch
          from openlithohub._utils.hopkins import simulate_aerial_image_hopkins, HopkinsParams
          from openlithohub.benchmark.metrics.epe import compute_epe
          mask = (torch.rand(64, 64) > 0.5).float()
          params = HopkinsParams(pixel_size_nm=2.0)
          simulate_aerial_image_hopkins(mask, params)  # warmup (kernel build)
          t0 = time.perf_counter(); simulate_aerial_image_hopkins(mask, params)
          dt = time.perf_counter() - t0
          assert dt < 0.5, f"hopkins forward catastrophic regression: {dt:.3f}s"
          a = (torch.rand(64, 64) > 0.5).float()
          t0 = time.perf_counter(); compute_epe(a, a)
          dt = time.perf_counter() - t0
          assert dt < 0.5, f"epe catastrophic regression: {dt:.3f}s"
          print("perf sentinel OK")
          PY

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package + security tools
        run: |
          pip install .
          pip install pip-audit bandit
      - name: pip-audit (installed environment)
        run: |
          # Build --ignore-vuln args from .github/pip-audit-ignore.txt (skip blanks/comments)
          args=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="${line//[[:space:]]/}"
            [ -z "$line" ] || args+=(--ignore-vuln "$line")
          done < .github/pip-audit-ignore.txt
          echo "Ignoring ${#args[@]} entries"
          pip-audit "${args[@]}"
      - name: pip-audit (optional extras — weekly only, audit P1.24)
        if: github.event_name == 'schedule'
        run: |
          pip install '.[data,workflow,models,server,export]'
          args=()
          while IFS= read -r line; do
            line="${line%%#*}"
            line="${line//[[:space:]]/}"
            [ -z "$line" ] || args+=(--ignore-vuln "$line")
          done < .github/pip-audit-ignore.txt
          pip-audit "${args[@]}"
      - name: Bandit (gate on medium+ severity)
        run: bandit -r src/ -ll

  license-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install scancode-toolkit
        run: pip install scancode-toolkit
      - name: Scan for copyleft licenses
        run: |
          scancode --license --copyright --only-findings --strip-root src/openlithohub/ > scancode-report.txt 2>&1 || true
          echo "--- Scan results ---"
          cat scancode-report.txt
          # Fail if any GPL/AGPL detected
          if grep -qiE '(GPL|AGPL|copyleft)' scancode-report.txt; then
            echo "::error::Copyleft license detected in source code"
            exit 1
          fi
          echo "No copyleft licenses found."
