name: Docker

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/docker.yml"
      - "pyproject.toml"
      - "src/**"
      - "NOTICE"

# P1.7: least-privilege. PR builds/test don't need package write.
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Resolve build identity (audit P0.11)
        id: buildid
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0.dev0"
          fi
          {
            echo "version=${VERSION}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Build CLI image (and push on tag)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: ${{ github.event_name != 'push' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.buildid.outputs.version }}
            BUILD_COMMIT=${{ steps.buildid.outputs.commit }}

      - name: Extract server image metadata
        id: meta_server
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},suffix=-server
            type=sha,suffix=-server

      - name: Build server image (and push on tag)
        id: build_server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server
          load: ${{ github.event_name != 'push' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          build-args: |
            VERSION=${{ steps.buildid.outputs.version }}
            BUILD_COMMIT=${{ steps.buildid.outputs.commit }}

      - name: Extract server-cpu image metadata
        id: meta_servercpu
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},suffix=-server-cpu
            type=sha,suffix=-server-cpu

      - name: Build minimal server-cpu image (and push on tag)
        id: build_servercpu
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: server-cpu
          load: ${{ github.event_name != 'push' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_servercpu.outputs.tags }}
          labels: ${{ steps.meta_servercpu.outputs.labels }}
          build-args: |
            VERSION=${{ steps.buildid.outputs.version }}
            BUILD_COMMIT=${{ steps.buildid.outputs.commit }}

      - name: Resolve smoke-test image tag
        id: smoketag
        run: |
          tag="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Smoke test — CLI entrypoint
        run: docker run --rm "${{ steps.smoketag.outputs.tag }}" --version

      - name: Smoke test — KLayout + openlithohub import
        run: |
          docker run --rm --entrypoint python "${{ steps.smoketag.outputs.tag }}" \
            -c "import klayout.db; import openlithohub; print('ok')"

      - name: Smoke test — package version and baked build identity (P0.11)
        run: |
          expected_version="${{ steps.buildid.outputs.version }}"
          actual="$(docker run --rm --entrypoint openlithohub "${{ steps.smoketag.outputs.tag }}" --version)"
          echo "openlithohub --version -> $actual (expected $expected_version)"
          docker run --rm --entrypoint python "${{ steps.smoketag.outputs.tag }}" \
            -c "import openlithohub._build as b; assert b.BUILD_COMMIT == '${{ steps.buildid.outputs.commit }}', b.BUILD_COMMIT; print('build identity ok')"

      - name: Smoke test — runtime image is genuine CPU torch (PR-B blocker A)
        run: |
          docker run --rm --entrypoint python "${{ steps.smoketag.outputs.tag }}" \
            -c "import torch; assert torch.version.cuda is None, torch.version.cuda; print('CPU torch verified')"

      - name: Smoke test — server-cpu image health + structure + OCI truthfulness (PR-B blocker A / tail C)
        run: |
          tag="$(echo "${{ steps.meta_servercpu.outputs.tags }}" | head -n1)"
          docker run -d --rm --name olh-servercpu-smoke -p 8001:8000 "$tag"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/v1/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8001/v1/health > /dev/null || { echo 'FATAL: server-cpu never became healthy'; docker logs olh-servercpu-smoke | tail -20; exit 1; }

          # Tail C: endpoint identity must equal BOTH the expected build
          # commit AND the image's real org.opencontainers.image.revision
          # label — build args alone prove nothing.
          body="$(curl -sf http://127.0.0.1:8001/v1/version)"
          echo "$body"
          endpoint_commit="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["git_commit"])')"
          oci_revision="$(docker image inspect "$tag" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          expected_commit="${{ steps.buildid.outputs.commit }}"
          echo "endpoint=$endpoint_commit oci_revision=$oci_revision expected=$expected_commit"
          if [ -z "$oci_revision" ]; then
            echo "FATAL: org.opencontainers.image.revision label missing"
            docker rm -f olh-servercpu-smoke > /dev/null || true; exit 1
          fi
          if [ "$endpoint_commit" != "$expected_commit" ] || [ "$oci_revision" != "$expected_commit" ]; then
            echo "FATAL: endpoint/OCI/expected commit mismatch"
            docker rm -f olh-servercpu-smoke > /dev/null || true; exit 1
          fi
          # Recommended (non-blocking): source/version OCI labels present.
          for label in org.opencontainers.image.source org.opencontainers.image.version; do
            docker image inspect "$tag" --format "{{ index .Config.Labels \"$label\" }}" | grep -q . \
              || echo "WARN: OCI label $label missing"
          done

          # Blocker A: genuine CPU torch + no CUDA/NVIDIA distributions.
          docker exec olh-servercpu-smoke python -c \
            "import torch; assert torch.version.cuda is None, torch.version.cuda; print('CPU torch verified')"
          docker exec olh-servercpu-smoke python -c "
          import importlib.metadata as md
          cuda_pkgs = [
              d.metadata['Name']
              for d in md.distributions()
              if (d.metadata.get('Name') or '').lower().startswith('nvidia-')
          ]
          assert not cuda_pkgs, cuda_pkgs
          print('no nvidia-* CUDA distributions verified')
          "

          # server-cpu truthfulness: no jupyter in the minimal image
          docker exec olh-servercpu-smoke python -c "import importlib.util as u; assert u.find_spec('jupyter') is None" \
            || { echo 'FATAL: jupyter present in server-cpu'; docker rm -f olh-servercpu-smoke > /dev/null || true; exit 1; }
          docker rm -f olh-servercpu-smoke > /dev/null

      - name: Smoke test — server image starts and answers /v1/health
        run: |
          server_tag="$(echo "${{ steps.meta_server.outputs.tags }}" | head -n1)"
          docker run -d --rm --name olh-server-smoke -p 8000:8000 "$server_tag"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/v1/health > /dev/null; then
              echo "server healthy"; docker logs olh-server-smoke | tail -5
              docker rm -f olh-server-smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs olh-server-smoke | tail -20
          docker rm -f olh-server-smoke > /dev/null
          exit 1

      - name: Report final image size
        run: |
          size_bytes=$(docker image inspect "${{ steps.smoketag.outputs.tag }}" --format '{{.Size}}')
          size_mb=$(awk -v b="$size_bytes" 'BEGIN { printf "%.1f", b/1024/1024 }')
          {
            echo "### Docker image"
            echo ""
            echo "- Tag: \`${{ steps.smoketag.outputs.tag }}\`"
            echo "- Size: **${size_mb} MB**"
          } >> "$GITHUB_STEP_SUMMARY"
