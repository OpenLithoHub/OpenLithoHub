name: Docker

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - ".github/workflows/docker.yml"
      - "pyproject.toml"
      - "src/**"
      - "NOTICE"

# P1.7: least-privilege. PR builds/test don't need package write.
permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Resolve build identity (audit P0.11)
        id: buildid
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0.dev0"
          fi
          {
            echo "version=${VERSION}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Build CLI image (and push on tag)
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          target: runtime
          load: ${{ github.event_name != 'push' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.buildid.outputs.version }}
            BUILD_COMMIT=${{ steps.buildid.outputs.commit }}

      - name: Extract server image metadata
        id: meta_server
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},suffix=-server
            type=sha,suffix=-server

      - name: Build server image (and push on tag)
        id: build_server
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          target: server
          load: ${{ github.event_name != 'push' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
          build-args: |
            VERSION=${{ steps.buildid.outputs.version }}
            BUILD_COMMIT=${{ steps.buildid.outputs.commit }}

      - name: Extract server-cpu image metadata
        id: meta_servercpu
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},suffix=-server-cpu
            type=sha,suffix=-server-cpu

      - name: Build minimal server-cpu image (and push on tag)
        id: build_servercpu
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          target: server-cpu
          load: ${{ github.event_name != 'push' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_servercpu.outputs.tags }}
          labels: ${{ steps.meta_servercpu.outputs.labels }}
          build-args: |
            VERSION=${{ steps.buildid.outputs.version }}
            BUILD_COMMIT=${{ steps.buildid.outputs.commit }}

      - name: Resolve smoke-test image tag
        id: smoketag
        run: |
          tag="$(echo "${{ steps.meta.outputs.tags }}" | head -n1)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Smoke test — CLI entrypoint
        run: docker run --rm "${{ steps.smoketag.outputs.tag }}" --version

      - name: Smoke test — KLayout + openlithohub import
        run: |
          docker run --rm --entrypoint python "${{ steps.smoketag.outputs.tag }}" \
            -c "import klayout.db; import openlithohub; print('ok')"

      - name: Smoke test — package version and baked build identity (P0.11)
        run: |
          expected_version="${{ steps.buildid.outputs.version }}"
          actual="$(docker run --rm --entrypoint openlithohub "${{ steps.smoketag.outputs.tag }}" --version)"
          echo "openlithohub --version -> $actual (expected $expected_version)"
          docker run --rm --entrypoint python "${{ steps.smoketag.outputs.tag }}" \
            -c "import openlithohub._build as b; assert b.BUILD_COMMIT == '${{ steps.buildid.outputs.commit }}', b.BUILD_COMMIT; print('build identity ok')"

      - name: Smoke test — server-cpu image health + OCI revision == /v1/version commit
        run: |
          tag="$(echo "${{ steps.meta_servercpu.outputs.tags }}" | head -n1)"
          docker run -d --rm --name olh-servercpu-smoke -p 8001:8000 "$tag"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8001/v1/health > /dev/null; then break; fi
            sleep 2
          done
          body="$(curl -sf http://127.0.0.1:8001/v1/version)"
          echo "$body"
          commit="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin)["git_commit"])')"
          if [ "$commit" != "${{ steps.buildid.outputs.commit }}" ]; then
            echo "FATAL: /v1/version commit ($commit) != OCI revision (${{ steps.buildid.outputs.commit }})"
            docker logs olh-servercpu-smoke | tail -20
            docker rm -f olh-servercpu-smoke > /dev/null || true
            exit 1
          fi
          # server-cpu truthfulness: no jupyter in the minimal image
          docker exec olh-servercpu-smoke python -c "import importlib.util as u; assert u.find_spec('jupyter') is None" \
            || { echo 'FATAL: jupyter present in server-cpu'; docker rm -f olh-servercpu-smoke > /dev/null || true; exit 1; }
          docker rm -f olh-servercpu-smoke > /dev/null

      - name: Smoke test — server image starts and answers /v1/health
        run: |
          server_tag="$(echo "${{ steps.meta_server.outputs.tags }}" | head -n1)"
          docker run -d --rm --name olh-server-smoke -p 8000:8000 "$server_tag"
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/v1/health > /dev/null; then
              echo "server healthy"; docker logs olh-server-smoke | tail -5
              docker rm -f olh-server-smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs olh-server-smoke | tail -20
          docker rm -f olh-server-smoke > /dev/null
          exit 1

      - name: Report final image size
        run: |
          size_bytes=$(docker image inspect "${{ steps.smoketag.outputs.tag }}" --format '{{.Size}}')
          size_mb=$(awk -v b="$size_bytes" 'BEGIN { printf "%.1f", b/1024/1024 }')
          {
            echo "### Docker image"
            echo ""
            echo "- Tag: \`${{ steps.smoketag.outputs.tag }}\`"
            echo "- Size: **${size_mb} MB**"
          } >> "$GITHUB_STEP_SUMMARY"
