name: P-054 proof replay

on:
  push:
    paths:
      - "src/openlithohub/verify/**"
      - "proof_artifacts/**"
      - "scripts/check_verification_status.py"
      - "scripts/fetch_proof_artifacts.py"
      - "scripts/replay_p054_artifact.py"
      - ".github/workflows/p054-proof-replay.yml"
      - "tests/test_verify/test_p054_*.py"
  pull_request:
    paths:
      - "src/openlithohub/verify/**"
      - "proof_artifacts/**"
      - "scripts/check_verification_status.py"
      - "scripts/fetch_proof_artifacts.py"
      - "scripts/replay_p054_artifact.py"
      - ".github/workflows/p054-proof-replay.yml"
      - "tests/test_verify/test_p054_*.py"
  workflow_dispatch:
  schedule:
    # weekly full replay, Sundays 03:17 UTC
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  p054-fast-gate:
    # Offline structural replay: schemas, layer/type stratification,
    # claim firewall, status manifest.  No external artifacts needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322ed31bde414eec1
      - uses: actions/setup-python@0a5c61591373683505ea898d09fdccdc57c2ab49
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip wheel
          python -m pip install -e ".[workflow]" pytest ruff mypy
      - name: Ruff (verify + scripts)
        run: |
          ruff check src/openlithohub/verify scripts/
          ruff format --check src/openlithohub/verify scripts/
      - name: Mypy (verify)
        run: mypy src/openlithohub/verify
      - name: Offline proof tests
        run: pytest -q tests/test_verify
      - name: Verification status manifest
        run: python scripts/check_verification_status.py

  p054-full-replay:
    # Full replay actually FETCHES the frozen artifact (the registry's
    # file-level download_url + sha256), verifies it, and runs the
    # artifact-required numeric shard in strict mode.  Missing artifacts,
    # hash mismatches, model-identity mismatches and proof-level downgrades
    # are HARD failures here — never silent skips.
    runs-on: ubuntu-latest
    needs: p054-fast-gate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    env:
      B04_PROOF_REPLAY_STRICT: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322ed31bde414eec1
      - uses: actions/setup-python@0a5c61591373683505ea898d09fdccdc57c2ab49
        with:
          python-version: "3.12"
      - name: Install (minimal hermetic replay environment)
        run: python -m pip install pytest
      - name: Fetch frozen artifact (download + hash-verify)
        run: python scripts/fetch_proof_artifacts.py --profile p054-arf37
      - name: Re-verify artifact identity
        if: steps.activation_preflight.outputs.needs_replay == 'true'
        run: python scripts/fetch_proof_artifacts.py --profile p054-arf37 --verify-only
      - name: Imported-certificate verification shard
        run: PYTHONPATH=src pytest -q tests/test_verify/test_p054_full_replay.py -m proof_artifact_required
      - name: Produce the canonical replay receipt
        run: |
          PYTHONPATH=src python scripts/replay_p054_artifact.py \
            --profile p054-arf37 \
            --artifact proof_artifacts/p054/external/p054-arf37-frozen-artifact.zip \
            --receipt-out p054-replay-receipt.json \
            --report-out p054-replay-report.json
      - name: Status manifest after replay
        run: python scripts/check_verification_status.py
      - name: Preserve replay evidence (never the frozen artifact itself)
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb0b8836a71a4b6cec80
        with:
          name: p054-replay-logs
          path: |
            p054-replay-receipt.json
            p054-replay-report.json
            pytest-output.txt
          if-no-files-found: error

  p054-release-activation:
    # Release-authority PRs must prove the promoted status against the
    # EXACT external bytes: fetch, verify, replay, and compare a FRESH
    # receipt with the committed one.  Missing/absent evidence is fatal.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322ed31bde414eec1
      - uses: actions/setup-python@0a5c61591373683505ea898d09fdccdc57c2ab49
        with:
          python-version: "3.12"
      # ENV2: the activation checker/replay/producer are stdlib-only — no
      # pip install at all, so the environment cannot drift.
      - name: Activation preflight (PR-3E3 — controls all external steps)
        id: activation_preflight
        run: |
          python - <<'PY'
          import json, os, pathlib
          registry = json.loads(pathlib.Path("proof_artifacts/registry.json").read_text())
          entry = next(
              (a for a in registry["artifacts"] if "p054-full-replay" in a.get("required_for", [])),
              {},
          )
          status = json.loads(pathlib.Path("proof_artifacts/verification-status.json").read_text())
          state = status.get("finite_declared_model", {}).get("full_artifact_replay", "")
          passing = state in {
              "IMPORTED_CERTIFICATE_VERIFIED",
              "SOURCE_NATIVE_RECOMPUTED",
              "FULL_REPLAY_PASSED",
          }
          identity_complete = (
              entry.get("sha256") is not None
              and entry.get("download_url") is not None
              and entry.get("bytes") is not None
          )
          needs_replay = identity_complete or passing
          reason = (
              "artifact identity complete or passing status proposed"
              if needs_replay
              else "artifact identity incomplete and state non-passing"
          )
          out = os.environ.get("GITHUB_OUTPUT")
          if out:
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(f"needs_replay={'true' if needs_replay else 'false'}\n")
          preflight_report = {
              "schema": "P054.activation-preflight.v1",
              "needs_replay": needs_replay,
              "reason": reason,
              "status": state,
          }
          pathlib.Path("activation-preflight.json").write_text(
              json.dumps(preflight_report, indent=2) + "\n", encoding="utf-8"
          )
          print(f"preflight: needs_replay={needs_replay} ({reason})")
          PY
      - name: Fetch frozen artifact (download + hash-verify)
        id: fetch
        if: steps.activation_preflight.outputs.needs_replay == 'true'
        run: |
          python scripts/fetch_proof_artifacts.py --profile p054-arf37
          python scripts/fetch_proof_artifacts.py --profile p054-arf37 --verify-only
      - name: Replay and produce a FRESH receipt
        if: steps.activation_preflight.outputs.needs_replay == 'true'
        run: |
          PYTHONPATH=src python scripts/replay_p054_artifact.py \
            --profile p054-arf37 \
            --artifact proof_artifacts/p054/external/p054-arf37-frozen-artifact.zip \
            --receipt-out /tmp/p054-replay-receipt.json \
            --report-out /tmp/p054-replay-report.json
          cp /tmp/p054-replay-receipt.json replay-receipt-fresh.json
          cp /tmp/p054-replay-report.json replay-report-fresh.json
      - name: Compare fresh receipt with the committed one (exact equality)
        if: steps.activation_preflight.outputs.needs_replay == 'true'
        run: |
          python - <<'PY'
          import json, pathlib, sys
          fresh = json.loads(pathlib.Path("/tmp/p054-replay-receipt.json").read_text())
          committed = pathlib.Path("proof_artifacts/p054/replay-receipt.json")
          status = json.loads(pathlib.Path("proof_artifacts/verification-status.json").read_text())
          state = status.get("finite_declared_model", {}).get("full_artifact_replay", "")
          passing = state in {"IMPORTED_CERTIFICATE_VERIFIED", "SOURCE_NATIVE_RECOMPUTED", "FULL_REPLAY_PASSED"}
          if not passing:
              print(f"status {state!r} is not passing; fresh receipt recorded for review")
              sys.exit(0)
          if not committed.exists():
              print("FAIL: passing status requires a committed replay receipt", file=sys.stderr)
              sys.exit(1)
          committed_doc = json.loads(committed.read_text())
          # PR-3E: the receipt is deterministic given the artifact, so the
          # release condition is EXACT whole-receipt equality — every key.
          if committed_doc != fresh:
              diff = {k: (committed_doc.get(k), fresh.get(k))
                      for k in set(committed_doc) | set(fresh)
                      if committed_doc.get(k) != fresh.get(k)}
              print(f"FAIL: committed receipt != fresh replay: {diff}", file=sys.stderr)
              sys.exit(1)
          print("committed receipt is exactly equal to the fresh replay")
          PY
      - name: Status manifest against the fresh evidence
        if: steps.activation_preflight.outputs.needs_replay == 'true'
        run: python scripts/check_verification_status.py --report-head
      - name: Offline status manifest (stable, always)
        run: python scripts/check_verification_status.py
      - name: Preserve replay evidence (never the frozen artifact itself)
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb0b8836a71a4b6cec80
        with:
          name: p054-activation-evidence
          path: |
            activation-preflight.json
            replay-receipt-fresh.json
            replay-report-fresh.json
            pytest-output.txt
          if-no-files-found: error
