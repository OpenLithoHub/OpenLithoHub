name: P-054 proof replay

on:
  push:
    paths:
      - "src/openlithohub/verify/**"
      - "proof_artifacts/**"
      - "scripts/check_verification_status.py"
      - "scripts/fetch_proof_artifacts.py"
      - ".github/workflows/p054-proof-replay.yml"
      - "tests/test_verify/test_p054_*.py"
  pull_request:
    paths:
      - "src/openlithohub/verify/**"
      - "proof_artifacts/**"
      - "scripts/check_verification_status.py"
      - "scripts/fetch_proof_artifacts.py"
      - ".github/workflows/p054-proof-replay.yml"
      - "tests/test_verify/test_p054_*.py"
  workflow_dispatch:
  schedule:
    # weekly full replay, Sundays 03:17 UTC
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  p054-fast-gate:
    # Offline structural replay: schemas, layer/type stratification,
    # claim firewall, status manifest.  No external artifacts needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip wheel
          python -m pip install -e ".[workflow]" pytest ruff mypy
      - name: Ruff (verify + scripts)
        run: |
          ruff check src/openlithohub/verify scripts/
          ruff format --check src/openlithohub/verify scripts/
      - name: Mypy (verify)
        run: mypy src/openlithohub/verify
      - name: Offline proof tests
        run: pytest -q tests/test_verify
      - name: Verification status manifest
        run: python scripts/check_verification_status.py

  p054-full-replay:
    # Full replay actually FETCHES the frozen artifact (the registry's
    # file-level download_url + sha256), verifies it, and runs the
    # artifact-required numeric shard in strict mode.  Missing artifacts,
    # hash mismatches, model-identity mismatches and proof-level downgrades
    # are HARD failures here — never silent skips.
    runs-on: ubuntu-latest
    needs: p054-fast-gate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    env:
      B04_PROOF_REPLAY_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip wheel
          python -m pip install -e ".[workflow]" pytest
      - name: Fetch frozen artifact (download + hash-verify)
        run: python scripts/fetch_proof_artifacts.py --profile p054-arf37
      - name: Re-verify artifact identity
        run: python scripts/fetch_proof_artifacts.py --profile p054-arf37 --verify-only
      - name: Numeric replay shard
        run: pytest -q tests/test_verify/test_p054_full_replay.py -m proof_artifact_required
      - name: Status manifest after replay
        run: python scripts/check_verification_status.py
      - name: Preserve replay logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p054-replay-logs
          path: |
            proof_artifacts/p054/external/
            pytest-output/
          if-no-files-found: ignore
