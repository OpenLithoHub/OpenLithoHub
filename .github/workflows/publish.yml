name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build twine cyclonedx-bom
      - name: Build wheel and sdist
        run: python -m build
      - name: Tag/version consistency (audit P1.7)
        run: |
          expected="v${SETUPTOOLS_SCM_PRETEND_VERSION:-}"
          tag="${GITHUB_REF_NAME}"
          version_file="$(ls dist/*.whl | head -n1 | sed 's/.*openlithohub-\([^-]*\)-.*/\1/')"
          echo "tag=$tag wheel_version=$version_file"
          [ "$tag" = "v$version_file" ] || {
            echo "tag $tag does not match wheel version $version_file"; exit 1; }
      - name: Twine check (audit P1.7)
        run: twine check dist/*
      - name: Generate CycloneDX SBOM (audit P1.8)
        run: |
          pip install dist/*.whl
          cyclonedx-py environment --output-format json --output-file sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
